[project]
name = "fvsroute"
version = "0.1.0"
description = "Selectivity-aware query routing for filtered vector search in PostgreSQL + pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.scripts]
fvs = "fvsroute.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fvsroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the running PostgreSQL container and the downloaded dataset",
]
addopts = "-ra"
