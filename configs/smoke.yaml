# Smoke test: whole pipeline on a 5,000-row prefix of the real dataset, 20 query vectors, all 9 levels.
# At 5,000 rows the 0.1% level has 5 eligible rows, exercising the |E| < k code paths.
run_id: smoke
seed: 20261107

dataset:
  url: https://storage.googleapis.com/ann-filtered-benchmark/datasets/laion-small-clip.tgz
  sha256: 6c88614ea225b0ebc959e2da7b345452381d927560c864ece45377e9ceb7d12c
  name: laion-small-clip
  n_rows: 5000
  dim: 512
  filter_field: similarity
  imputed_value: 0.0

workload:
  n_queries: 20
